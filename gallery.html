<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gallery | Michael Mikg</title>
    <!-- Copia qui la stessa riga dei font che hai in index.html -->
    <link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Gallery</h1>
        <p>Tutte le mie illustrazioni</p>
        <nav>
            <a href="index.html">← Home</a>
            <a href="index.html#progetti">Progetti</a>

        </nav>
    </header>


    <main class="larga">
        <div class="murales-box chiuso" id="murales-box">
            <div class="murales">
                <!--
  NUOVE IMMAGINI: incollale QUI, in cima, prima di tutte le altre.
  Le vecchie scendono da sole di una riga.
  Una riga = 4 celle: quadrato = 1, vert = 2, oriz = 2, grande = 4.
  Per non lasciare buchi, le celle aggiunte devono essere un multiplo di 4.
  Esempi: 4 quadrati / 1 oriz + 2 quadrati / 1 grande.
-->
                <!-- Righe 1-2 -->
                <img class="grande" src="images/gallery/01.png" data-titolo="Sirena" data-testo="Contest per DTIYS"
                    alt="Descrizione 1" loading="lazy">
                <img class="vert" src="images/gallery/02.jpeg" alt="Descrizione 2" loading="lazy">
                <img src="images/gallery/03.JPEG" alt="Descrizione 3" loading="lazy">
                <img src="images/gallery/04.jpeg" alt="Descrizione 4" loading="lazy">

                <!-- Righe 3-4 -->
                <img class="vert" src="images/gallery/05.JPEG" alt="Descrizione 5" loading="lazy">
                <img class="grande" src="images/gallery/06.PNG" alt="Descrizione 6" loading="lazy">
                <img class="vert" src="images/gallery/07.JPEG" alt="Descrizione 7" loading="lazy">

                <!-- Riga 5 -->
                <img class="oriz" src="images/gallery/08.png" alt="Descrizione 8" loading="lazy">
                <img src="images/gallery/09.jpeg" alt="Descrizione 9" loading="lazy">
                <img src="images/gallery/10.PNG" alt="Descrizione 10" loading="lazy">

                <!-- Riga 6 -->
                <img src="images/gallery/11.jpeg" alt="Descrizione 11" loading="lazy">
                <img src="images/gallery/12.png" alt="Descrizione 12" loading="lazy">
                <img class="oriz" src="images/gallery/15.JPEG" alt="Descrizione 13" loading="lazy">

                <!-- Righe 3-4 -->
                <img class="vert" src="images/gallery/14.png" alt="Descrizione 5" loading="lazy">
                <img class="grande" src="images/gallery/13.png" alt="Descrizione 6" loading="lazy">
                <img class="vert" src="images/gallery/16.JPEG" alt="Descrizione 7" loading="lazy">
            </div>
        </div>

        <button class="btn-altre" id="mostra-altre" type="button" aria-expanded="false">Mostra altre ↓</button>
    </main>

    <footer>
        <p>© 2026 Michael Mikg</p>
    </footer>

    <div class="lightbox" id="lightbox">
        <button class="freccia sinistra" id="prev" aria-label="Immagine precedente">&#10094;</button>

        <div class="lightbox-contenuto">
            <img id="lightbox-img" src="" alt="">
            <div class="didascalia">
                <h3 id="lightbox-titolo"></h3>
                <p id="lightbox-testo"></p>
            </div>
        </div>

        <button class="freccia destra" id="next" aria-label="Immagine successiva">&#10095;</button>
    </div>

    <script src="script.js"></script>

</body>

</html>
